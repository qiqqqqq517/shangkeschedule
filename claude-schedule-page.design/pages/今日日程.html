<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)" />
<title>今日日程 · 上课Shangke</title>
<link rel="stylesheet" href="../assets/claude-tokens.css" />
<link rel="stylesheet" href="../assets/claude-components.css" />
<style>
  /* ===== 页面骨架（设计稿视觉值，未改动） ===== */
  body {
    margin: 0;
    background: var(--background);
    color: var(--foreground);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }
  .page-today {
    display: flex;
    flex-direction: column;
    gap: calc(var(--spacing) * 6);
    padding: 0 calc(var(--spacing) * 5) calc(var(--spacing) * 4);
    background: var(--background);
    color: var(--foreground);
    font-family: var(--font-sans);
    position: relative;
  }

  /* ===== 状态栏 ===== */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: calc(var(--spacing) * 3) 0 calc(var(--spacing) * 1);
    font-size: 12px;
    font-weight: 600;
    color: var(--muted-foreground);
  }
  .status-time { flex: 1; text-align: center; padding-left: calc(var(--spacing) * 8); }
  .status-icons { display: flex; align-items: center; gap: calc(var(--spacing) * 1.5); }
  .status-icon { width: 16px; height: 16px; }

  /* ===== 顶部区域 ===== */
  .top-bar {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: calc(var(--spacing) * 3);
    padding-top: calc(var(--spacing) * 2);
  }
  .top-bar-left { flex: 1; min-width: 0; }
  .date-eyebrow {
    margin: 0 0 calc(var(--spacing) * 1.5);
    color: var(--muted-foreground);
    font: 600 11px/1.3 var(--font-serif);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .title-row { display: flex; align-items: center; gap: calc(var(--spacing) * 3); }
  .page-title {
    margin: 0;
    font: 600 28px/1.15 var(--font-display);
    color: var(--foreground);
    letter-spacing: -0.01em;
  }
  .course-count-badge { min-height: 28px; padding: 0 calc(var(--spacing) * 3); font-size: 11px; }
  .top-bar-actions { display: flex; align-items: center; gap: 4px; }
  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border: 1px solid transparent;
    border-radius: var(--radius);
    background: transparent;
    color: var(--foreground);
    cursor: pointer;
    transition: background-color .16s ease, border-color .16s ease, box-shadow .16s ease;
  }
  .icon-btn:hover { background: var(--muted); }
  .icon-btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .icon-lg { width: 20px; height: 20px; }
  .icon-sm { width: 14px; height: 14px; }

  /* ===== 周次切换条（交互新增，沿用设计稿胶囊语言） ===== */
  .week-switcher {
    display: flex;
    align-items: center;
    gap: calc(var(--spacing) * 2);
    padding: calc(var(--spacing) * 2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--popover);
    box-shadow: var(--shadow-xs);
  }
  .week-switcher-label {
    flex: 1;
    min-width: 0;
    text-align: center;
    font: 600 13px/1.3 var(--font-sans);
    color: var(--foreground);
  }
  .week-switcher-label small {
    display: block;
    font: 500 11px/1.4 var(--font-sans);
    color: var(--muted-foreground);
  }
  .week-step {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border: 1px solid var(--border);
    border-radius: var(--radius-full);
    background: var(--background);
    color: var(--foreground);
    cursor: pointer;
    transition: background-color .16s ease, color .16s ease;
  }
  .week-step:hover { background: var(--muted); }
  .week-step:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .week-step:disabled { opacity: .4; cursor: not-allowed; }

  /* ===== 分区标题 ===== */
  .section-label-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: calc(var(--spacing) * 3);
  }
  .section-label {
    font: 600 12px/1.2 var(--font-serif);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted-foreground);
  }
  .section-sub { font: 500 12px/1.2 var(--font-sans); color: var(--muted-foreground); }
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: calc(var(--spacing) * 3);
  }
  .section-header .section-label-row { margin-bottom: 0; flex: 1; }
  .view-all-btn { min-height: 32px; padding: 0 calc(var(--spacing) * 2.5); font-size: 12px; gap: calc(var(--spacing) * 1); box-shadow: none; }

  /* ===== 课程卡片 ===== */
  .course-section { display: flex; flex-direction: column; }
  .course-stack { display: grid; gap: calc(var(--spacing) * 3); }
  .course-card {
    position: relative;
    display: flex;
    align-items: stretch;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--popover);
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    text-align: left;
    padding: 0;
    font: inherit;
    color: inherit;
    width: 100%;
    transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease, opacity .2s ease;
  }
  .course-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-lg); border-color: var(--ring); }
  .course-card:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .course-accent { width: 5px; flex-shrink: 0; border-radius: var(--radius) 0 0 var(--radius); }
  .course-content { flex: 1; padding: calc(var(--spacing) * 4); min-width: 0; }
  .course-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: calc(var(--spacing) * 3);
    margin-bottom: calc(var(--spacing) * 3);
  }
  .course-name {
    margin: 0;
    font: 600 18px/1.2 var(--font-sans);
    color: var(--foreground);
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .course-type { flex-shrink: 0; min-height: 26px; padding: 0 calc(var(--spacing) * 2.5); font-size: 11px; }
  .type-required { background: var(--chart-2); border-color: transparent; color: var(--primary-foreground); }
  .type-lab { background: var(--chart-3); color: var(--foreground); border-color: var(--border); }
  .course-meta { display: grid; gap: calc(var(--spacing) * 2); }
  .meta-item {
    display: flex;
    align-items: center;
    gap: calc(var(--spacing) * 2);
    color: var(--secondary-foreground);
    font-size: 13px;
    line-height: 1.4;
  }
  .meta-icon { width: 14px; height: 14px; flex-shrink: 0; color: var(--muted-foreground); }
  .meta-text { font: 500 13px/1.4 var(--font-sans); }

  /* 已结束 */
  .course-done { opacity: 0.55; background: var(--card); box-shadow: none; }
  .course-done:hover { opacity: 0.7; box-shadow: var(--shadow-sm); }
  .course-done .course-name { text-decoration: line-through; text-decoration-color: var(--muted-foreground); }
  .done-indicator {
    position: absolute;
    top: calc(var(--spacing) * 3);
    right: calc(var(--spacing) * 4);
    font: 600 10px/1 var(--font-sans);
    color: var(--muted-foreground);
    background: var(--muted);
    padding: calc(var(--spacing) * 1) calc(var(--spacing) * 2);
    border-radius: var(--radius-sm);
    display: none;
  }

  /* 进行中 */
  .course-current { border-color: var(--primary); box-shadow: var(--shadow-md); }
  .course-current::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--primary);
    z-index: 1;
  }
  .live-indicator {
    position: absolute;
    top: calc(var(--spacing) * 3);
    right: calc(var(--spacing) * 4);
    display: inline-flex;
    align-items: center;
    gap: calc(var(--spacing) * 1.5);
    font: 600 10px/1 var(--font-sans);
    color: var(--primary);
    background: var(--brand-50);
    padding: calc(var(--spacing) * 1.5) calc(var(--spacing) * 2.5);
    border-radius: var(--radius-sm);
  }
  .live-indicator::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: var(--radius-full);
    background: var(--primary);
    animation: pulse-dot 1.5s ease-in-out infinite;
  }
  @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* ===== 明日预览 ===== */
  .tomorrow-section { display: flex; flex-direction: column; }
  .tomorrow-stack { display: grid; gap: calc(var(--spacing) * 2.5); }
  .tomorrow-card { display: flex; align-items: stretch; min-height: auto; padding: 0; overflow: hidden; }
  .tomorrow-accent { width: 4px; flex-shrink: 0; border-radius: var(--radius) 0 0 var(--radius); }
  .tomorrow-content { flex: 1; padding: calc(var(--spacing) * 3.5); min-width: 0; }
  .tomorrow-name { margin: 0 0 calc(var(--spacing) * 1.5); font: 600 15px/1.25 var(--font-sans); color: var(--foreground); }
  .tomorrow-meta { display: flex; align-items: center; gap: calc(var(--spacing) * 1.5); font-size: 12px; color: var(--muted-foreground); }
  .tomorrow-meta .meta-text { font-size: 12px; font-weight: 500; color: var(--muted-foreground); }
  .meta-dot { color: var(--border-400); }

  /* ===== 底栏占位 / 底栏 ===== */
  .bottom-nav-spacer { height: calc(var(--spacing) * 20); flex-shrink: 0; }
  #bottom-nav {
    position: fixed;
    bottom: calc(var(--spacing) * 3);
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 40px);
    max-width: 390px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    padding: 8px;
    background: var(--popover);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-lg);
    z-index: 100;
  }
  #bottom-nav .nav-item {
    display: grid;
    gap: 4px;
    justify-items: center;
    padding: 10px 8px;
    border-radius: calc(var(--radius) - 4px);
    appearance: none;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted-foreground);
    font: 600 11px/1.1 var(--font-sans);
    cursor: pointer;
    text-decoration: none;
    transition: background-color .16s ease, color .16s ease, border-color .16s ease, box-shadow .16s ease;
  }
  #bottom-nav .nav-item:hover { background: var(--muted); color: var(--foreground); }
  #bottom-nav .nav-item:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  #bottom-nav .nav-item.active { background: var(--primary-solid, var(--primary)); color: var(--primary-foreground); border-color: transparent; box-shadow: var(--shadow-sm); }
  .nav-icon { width: 20px; height: 20px; }
  .nav-label { font-size: 11px; white-space: nowrap; }

  /* ===== 宽屏详情栏（多端适配新增） ===== */
  .app-aside {
    padding: calc(var(--spacing) * 6) calc(var(--spacing) * 5);
    border-left: 1px solid var(--border);
    background: var(--card);
  }
  .aside-card {
    padding: calc(var(--spacing) * 4);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--popover);
    box-shadow: var(--shadow-xs);
    margin-bottom: calc(var(--spacing) * 4);
  }
  .aside-card h3 {
    margin: 0 0 calc(var(--spacing) * 3);
    font: 600 11px/1.2 var(--font-serif);
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted-foreground);
  }
  .aside-stat { display: flex; align-items: baseline; justify-content: space-between; padding: calc(var(--spacing) * 1.5) 0; }
  .aside-stat dt { font: 500 13px/1.4 var(--font-sans); color: var(--secondary-foreground); }
  .aside-stat dd { margin: 0; font: 600 18px/1.2 var(--font-display); color: var(--foreground); }
  .aside-legend { display: grid; gap: calc(var(--spacing) * 2); }
  .legend-row { display: flex; align-items: center; gap: calc(var(--spacing) * 2); font: 500 13px/1.4 var(--font-sans); color: var(--secondary-foreground); }
  .legend-dot { width: 10px; height: 10px; border-radius: var(--radius-full); flex-shrink: 0; }

  /* ===== 课程详情底部弹层（交互新增） ===== */
  .sheet-backdrop {
    position: fixed;
    inset: 0;
    background: color-mix(in srgb, var(--foreground) 42%, transparent);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
    z-index: 200;
  }
  .sheet-backdrop.open { opacity: 1; pointer-events: auto; }
  .detail-sheet {
    position: fixed;
    left: 50%;
    bottom: 0;
    transform: translate(-50%, 100%);
    width: 100%;
    max-width: 430px;
    max-height: 82vh;
    overflow-y: auto;
    padding: calc(var(--spacing) * 3) calc(var(--spacing) * 5) calc(var(--spacing) * 6);
    background: var(--popover);
    border: 1px solid var(--border);
    border-bottom: 0;
    border-radius: var(--radius-2xl) var(--radius-2xl) 0 0;
    box-shadow: var(--shadow-2xl);
    transition: transform .24s cubic-bezier(.2, .8, .2, 1);
    z-index: 210;
  }
  .detail-sheet.open { transform: translate(-50%, 0); }
  .sheet-grip { width: 36px; height: 4px; margin: 0 auto calc(var(--spacing) * 4); border-radius: var(--radius-full); background: var(--border-400); }
  .sheet-title { margin: 0 0 calc(var(--spacing) * 1); font: 600 20px/1.2 var(--font-sans); color: var(--foreground); }
  .sheet-sub { margin: 0 0 calc(var(--spacing) * 4); font: 500 12px/1.4 var(--font-serif); letter-spacing: .1em; text-transform: uppercase; color: var(--muted-foreground); }
  .sheet-rows { display: grid; gap: 1px; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--border); }
  .sheet-row { display: flex; align-items: center; justify-content: space-between; gap: calc(var(--spacing) * 3); padding: calc(var(--spacing) * 3.5) calc(var(--spacing) * 4); background: var(--background); }
  .sheet-row dt { font: 500 13px/1.4 var(--font-sans); color: var(--muted-foreground); }
  .sheet-row dd { margin: 0; font: 600 14px/1.4 var(--font-sans); color: var(--foreground); text-align: right; }
  .sheet-actions { display: flex; gap: calc(var(--spacing) * 3); margin-top: calc(var(--spacing) * 4); }
  .sheet-actions .btn { flex: 1; }

  /* ===== 响应式（设计稿 380px 断点保留 + 多端扩展） ===== */
  @media (max-width: 380px) {
    .page-today { padding: 0 calc(var(--spacing) * 4); }
    .page-title { font-size: 24px; }
    .course-content { padding: calc(var(--spacing) * 3.5); }
  }
  @media (min-width: 768px) {
    .status-bar { display: none; }
    .page-today { padding: 0 calc(var(--spacing) * 8) calc(var(--spacing) * 8); gap: calc(var(--spacing) * 7); }
    .page-title { font-size: 34px; }
    .course-stack { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
    .tomorrow-stack { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  }
  @media (min-width: 1200px) {
    .course-stack { grid-template-columns: 1fr; }
  }
</style>
</head>

  <!-- ===== 主内容区 ===== -->
  <main class="app-main">
    <div class="page-today app-view">

        <span class="status-time">9:41</span>
        <div class="status-icons">
          <svg class="status-icon" aria-hidden="true"><use href="#i-signal"></use></svg>
          <svg class="status-icon" aria-hidden="true"><use href="#i-wifi"></use></svg>
          <svg class="status-icon" aria-hidden="true"><use href="#i-battery-full"></use></svg>
        </div>
      </div>

      <!-- 顶部 -->

        <button class="week-step" type="button" id="week-next" aria-label="下一周">
          <svg class="icon-sm" aria-hidden="true"><use href="#i-chevron-right"></use></svg>
        </button>

      <!-- 今日课程列表 -->
      <section class="course-section" aria-labelledby="today-label">

          <span class="section-label" id="today-label">今天</span>

      <div class="bottom-nav-spacer"></div>

  </main>

  <!-- ===== 桌面端：右栏统计 / 图例 ===== -->

      <h3>今日概览</h3>
      <dl style="margin:0">
        <div class="aside-stat"><dt>课程</dt><dd id="stat-total">4</dd></div>
        <div class="aside-stat"><dt>已结束</dt><dd id="stat-done">1</dd></div>

        <div class="legend-row"><span class="legend-dot" style="background: var(--chart-1)"></span>实验</div>
      </div>

</div>

    <svg class="nav-icon" aria-hidden="true"><use href="#i-user-circle"></use></svg>
    <span class="nav-label">学期</span>
  </a>
</nav>

<!-- ===== 课程详情弹层 ===== -->
<div class="sheet-backdrop" id="sheet-backdrop"></div>
<section class="detail-sheet" id="detail-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">
  <div class="sheet-grip" aria-hidden="true"></div>
  <p class="sheet-sub" id="sheet-sub">进行中</p>
  <h2 class="sheet-title" id="sheet-title">大学英语</h2>
  <dl class="sheet-rows" id="sheet-rows"></dl>
  <div class="sheet-actions">
    <button class="btn secondary" type="button" id="sheet-close">关闭</button>
    <button class="btn primary" type="button" id="sheet-edit">编辑课程</button>
  </div>
</section>

<script src="../assets/claude-icons.js"></script>
<script src="../assets/claude-app.js"></script>
<script>
/* ============================================================================
 * 今日日程页交互
 * 数据为设计稿示例数据（高等数学 / 大学英语 / 数据结构 / 物理实验），
 * 仅用于演示状态与交互，接入真实数据时替换 TODAY / TOMORROW 即可。
 * ========================================================================== */
(function () {
  'use strict';

  var TODAY = [
    { id: 1, name: '高等数学', type: '必修', typeClass: '', state: 'done', accent: 'var(--chart-1)', time: '08:00 - 09:40', room: '教一 201', teacher: '王教授', weeks: '1-16 周', credit: '4.0' },
    { id: 2, name: '大学英语', type: '必修', typeClass: 'type-required', state: 'current', accent: 'var(--chart-2)', time: '10:00 - 11:40', room: '外语楼 305', teacher: '李老师', weeks: '1-16 周', credit: '3.0' },
    { id: 3, name: '数据结构', type: '选修', typeClass: '', state: 'upcoming', accent: 'var(--chart-3)', time: '14:00 - 15:40', room: '计算机楼 412', teacher: '张教授', weeks: '1-16 周', credit: '3.0' },
    { id: 4, name: '物理实验', type: '实验', typeClass: 'type-lab', state: 'upcoming', accent: 'var(--chart-5)', time: '16:00 - 17:40', room: '实验楼 B203', teacher: '陈老师', weeks: '3-16 周', credit: '1.0' }
  ];

  var TOMORROW = [
    { name: '计算机网络', accent: 'var(--chart-4)', time: '08:00 - 09:40', room: '信工楼 501' },
    { name: '线性代数', accent: 'var(--chart-1)', time: '10:00 - 11:40', room: '教二 103' }
  ];

  var STATE_TEXT = { done: '已结束', current: '进行中', upcoming: '未开始' };
  var week = 3;

  function el(html) {
    var t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ---------- 渲染今日课程 ---------- */
  function renderCourses() {
    var stack = document.getElementById('course-stack');
    stack.innerHTML = '';
    TODAY.forEach(function (c) {
      var card = el(
        '<button class="course-card course-' + (c.state === 'current' ? 'current' : c.state === 'done' ? 'done' : 'upcoming') + '"' +
        ' type="button" data-id="' + c.id + '" aria-label="' + esc(c.name) + '，' + esc(STATE_TEXT[c.state]) + '，' + esc(c.time) + '">' +
        '<span class="course-accent" style="background:' + c.accent + '"></span>' +
        '<span class="course-content">' +
        '<span class="course-header">' +
        '<h3 class="course-name">' + esc(c.name) + '</h3>' +
        '<span class="badge ' + (c.typeClass === 'type-required' ? 'filled' : c.typeClass === 'type-lab' ? 'muted' : 'outline') + ' course-type ' + c.typeClass + '">' + esc(c.type) + '</span>' +
        '</span>' +
        '<span class="course-meta">' +
        '<span class="meta-item"><svg class="meta-icon" aria-hidden="true"><use href="#i-clock"></use></svg><span class="meta-text">' + esc(c.time) + '</span></span>' +
        '<span class="meta-item"><svg class="meta-icon" aria-hidden="true"><use href="#i-map-pin"></use></svg><span class="meta-text">' + esc(c.room) + '</span></span>' +
        '<span class="meta-item"><svg class="meta-icon" aria-hidden="true"><use href="#i-user"></use></svg><span class="meta-text">' + esc(c.teacher) + '</span></span>' +
        '</span>' +
        '</span>' +
        (c.state === 'current' ? '<span class="live-indicator">进行中</span>' : '') +
        '</button>'
      );
      card.addEventListener('click', function () { openSheet(c); });
      stack.appendChild(card);
    });
  }

  /* ---------- 渲染明日预览 ---------- */
  function renderTomorrow() {
    var stack = document.getElementById('tomorrow-stack');
    stack.innerHTML = '';
    TOMORROW.forEach(function (c) {
      stack.appendChild(el(
        '<article class="card sunken tomorrow-card">' +
        '<div class="tomorrow-accent" style="background:' + c.accent + '"></div>' +
        '<div class="tomorrow-content">' +
        '<h4 class="tomorrow-name">' + esc(c.name) + '</h4>' +
        '<div class="tomorrow-meta"><span class="meta-text">' + esc(c.time) + '</span>' +
        '<span class="meta-dot">·</span><span class="meta-text">' + esc(c.room) + '</span></div>' +
        '</div></article>'
      ));
    });
    document.getElementById('tomorrow-count').textContent = TOMORROW.length + ' 节';
  }

  /* ---------- 统计 ---------- */
  function renderStats() {
    var done = TODAY.filter(function (c) { return c.state === 'done'; }).length;
    var live = TODAY.filter(function (c) { return c.state === 'current'; }).length;
    document.getElementById('course-count').textContent = TODAY.length + ' 节';
    document.getElementById('remaining-count').textContent = '剩余 ' + (TODAY.length - done) + ' 节';
    document.getElementById('stat-total').textContent = TODAY.length;
    document.getElementById('stat-done').textContent = done;
    document.getElementById('stat-live').textContent = live;
    document.getElementById('stat-hours').textContent = TODAY.length * 2;
  }

  /* ---------- 周次 ---------- */
  function renderWeek() {
    var base = new Date(2026, 8, 9); // 设计稿基准日 9月9日
    var start = new Date(base.getTime() + (week - 3) * 7 * 86400000);
    var end = new Date(start.getTime() + 6 * 86400000);
    var fmt = function (d) { return (d.getMonth() + 1) + '月' + d.getDate() + '日'; };
    document.getElementById('week-label').textContent = '第 ' + week + ' 周';
    document.getElementById('week-range').textContent = fmt(start) + ' – ' + fmt(end);
    document.getElementById('week-prev').disabled = week <= 1;
    try { localStorage.setItem('shangke-claude-week', String(week)); } catch (e) {}
  }

  document.getElementById('week-prev').addEventListener('click', function () {
    if (week > 1) { week--; renderWeek(); }
  });
  document.getElementById('week-next').addEventListener('click', function () {
    if (week < 20) { week++; renderWeek(); }
  });

  /* ---------- 详情弹层 ---------- */
  var sheet = document.getElementById('detail-sheet');
  var backdrop = document.getElementById('sheet-backdrop');
  var lastFocused = null;

  function openSheet(course) {
    lastFocused = document.activeElement;
    document.getElementById('sheet-title').textContent = course.name;
    document.getElementById('sheet-sub').textContent = STATE_TEXT[course.state] + ' · ' + course.type;
    document.getElementById('sheet-rows').innerHTML =
      row('上课时间', course.time) +
      row('上课地点', course.room) +
      row('授课教师', course.teacher) +
      row('上课周次', course.weeks) +
      row('学分', course.credit);
    sheet.classList.add('open');
    backdrop.classList.add('open');
    sheet.focus();
  }

  function row(k, v) {
    return '<div class="sheet-row"><dt>' + esc(k) + '</dt><dd>' + esc(v) + '</dd></div>';
  }

  function closeSheet() {
    sheet.classList.remove('open');
    backdrop.classList.remove('open');
    if (lastFocused && lastFocused.focus) lastFocused.focus();
  }

  backdrop.addEventListener('click', closeSheet);
  document.getElementById('sheet-close').addEventListener('click', closeSheet);
  document.getElementById('sheet-edit').addEventListener('click', function () {
    closeSheet();
    window.location.href = '组件预览.html#section-forms';
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && sheet.classList.contains('open')) closeSheet();
  });

  /* ---------- 查看全部 ---------- */
  document.getElementById('view-all-btn').addEventListener('click', function () {
    window.location.href = '周课表.html';
  });

  /* ---------- 日期 / 周次恢复 ---------- */
  try {
    var saved = parseInt(localStorage.getItem('shangke-claude-week'), 10);
    if (saved >= 1 && saved <= 20) week = saved;
  } catch (e) {}

  renderCourses();
  renderTomorrow();
  renderStats();
  renderWeek();
})();
</script>
</body>
</html>
