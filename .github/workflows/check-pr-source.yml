name: Check PR Source Branch

on:
  pull_request:
    branches:
      - main # 只有合并到 main 分支的 PR 才会触发

jobs:
  check_branch_and_repo:
    runs-on: ubuntu-latest
    steps:
      - name: 检查仓库来源
        run: |
          # 获取目标仓库的完整名称 (例如: MyOrg/MyRepo)
          TARGET_REPO="${{ github.repository }}"
          # 获取PR来源仓库的完整名称 (如果是Fork, 名称会不同)
          SOURCE_REPO="${{ github.event.pull_request.head.repo.full_name }}"
          # 获取PR来源分支的名称
          SOURCE_BRANCH="${{ github.head_ref }}"

          echo "--- 检查信息 ---"
          echo "目标仓库 (本仓库): $TARGET_REPO"
          echo "PR来源仓库: $SOURCE_REPO"
          echo "PR来源分支名称: $SOURCE_BRANCH"
          echo "----------------"

          # 1. 检查来源是否为本仓库（即阻止来自 Fork 仓库的 PR）
          if [ "$SOURCE_REPO" != "$TARGET_REPO" ]; then
            echo "::error file=check-pr-source.yml::[错误] main 分支只接受来自【本仓库】的合并请求。来源仓库 ($SOURCE_REPO) 与目标仓库 ($TARGET_REPO) 不一致。"
            exit 1
          fi

          # 2. 不再限定来源分支名。
          #
          # 原实现要求 REQUIRED_BRANCH="dev"，但本仓库**从无 dev 分支**，且
          # AGENTS.md 的分支策略是「main 常驻 + 短生命周期 feat/<主题> / fix/<主题>」
          # ⇒ 该限制会让**每一个**进 main 的 PR 都带一个恒失败的检查（P1-39 / P2-38），
          # 使这个守卫在实际上被无视，等于零防护。
          #
          # 保留的判定只在上一段（阻止 Fork），这与仓库真实策略一致。
          # 若日后确实启用 dev 集成分支，请连同 AGENTS.md 分支决策树一并修改。
          echo "[通过] 检查成功：PR 来自本仓库。来源分支 '$SOURCE_BRANCH'（不限定名称）。"