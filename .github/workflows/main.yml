name: Gradle Dependency Submission
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  submit-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Submit Gradle dependencies
        uses: gradle/actions/dependency-submission@v4
