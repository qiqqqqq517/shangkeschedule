# 创建目录
mkdir -p .github/workflows

# 创建文件 .github/workflows/dependency-submission.yml
cat > .github/workflows/dependency-submission.yml << 'EOF'
name: Dependency Submission

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Run Gradle dependency submission
        uses: gradle/actions/dependency-submission@v3
        with:
          gradle-version: wrapper
          cache-disabled: false
EOF

# 推送
git add .github/workflows/dependency-submission.yml
git commit -m "fix: 创建 Gradle 依赖提交工作流"
git push origin main
