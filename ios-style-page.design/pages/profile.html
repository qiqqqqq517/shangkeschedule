<html lang="zh-CN" class="light">
<head>
  <meta charset="UTF-8">

  <script src="https://cdn.tailwindcss.com/@tailwindcss/browser@4"></script>
  <style id="theme-vars">
    :root {
      /* Spacing base unit */
      --spacing: 0.24rem;

      /* Radius */
      --radius: 1.2rem;
      --radius-sm: calc(var(--radius) * 0.5);
      --radius-md: var(--radius);
      --radius-lg: calc(var(--radius) * 1.5);

      /* Typography */
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;

      /* Brand / Primary — iOS System Blue */
      --brand-50: #e8f2ff;
      --brand-100: #cfe5ff;
      --brand-200: #9fcbff;
      --brand-300: #66abff;
      --brand-400: #2e8dff;
      --brand-500: #007AFF;
      --brand-600: #0064d6;
      --brand-700: #004fad;
      --brand-800: #003b82;
      --brand-900: #00275a;
      --primary: var(--brand-500);

      /* Backgrounds */
      --background: #ffffff;
      --background-100: #f7f7fa;
      --background-200: #f2f2f7;
      --background-300: #e5e5ea;
      --background-400: #d1d1d6;

      /* Text */
      --foreground: #1d1d1f;
      --text-400: #8e8e93;
      --text-500: #6e6e73;
      --muted-foreground: var(--text-400);

      /* Border / Separator */
      --border: var(--background-300);
      --ios-separator: rgba(60, 60, 67, 0.36);

      /* Shadows */
      --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.04);
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05), 0 1px 3px -1px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.08), 0 4px 8px -4px rgba(0, 0, 0, 0.05);

      /* iOS System Colors */
      --ios-blue: #007AFF;
      --ios-green: #34C759;
      --ios-orange: #FF9500;
      --ios-purple: #AF52DE;
      --ios-red: #FF3B30;
      --ios-teal: #30B0C7;
      --ios-indigo: #5856D6;
      --ios-pink: #FF2D55;
      --ios-yellow: #FFCC00;

      /* Frosted glass */
      --glass-bg: rgba(255, 255, 255, 0.72);
      --glass-border: rgba(0, 0, 0, 0.08);

      /* Brand tints */
      --brand-tint-xs: rgba(0, 122, 255, 0.035);
      --brand-tint-sm: rgba(0, 122, 255, 0.08);
      --brand-tint-md: rgba(0, 122, 255, 0.12);
      --brand-tint-lg: rgba(0, 122, 255, 0.2);

      /* Card */
      --card: #ffffff;
      --card-foreground: var(--foreground);
      --muted: var(--background-200);

      /* Primary foreground */
      --primary-foreground: #ffffff;
    }
  </style>
  <style type="text/tailwindcss">
    @theme inline {
      --color-background: var(--background);
      --color-foreground: var(--foreground);
      --color-card: var(--card);
      --color-card-foreground: var(--card-foreground);
      --color-primary: var(--primary);
      --color-primary-foreground: var(--primary-foreground);
      --color-muted: var(--muted);
      --color-muted-foreground: var(--muted-foreground);
      --color-border: var(--border);
      --radius-sm: var(--radius-sm);
      --radius-md: var(--radius-md);
      --radius-lg: var(--radius-lg);
    }
    @layer base {
      * { border-color: var(--border); }
      body {
        background-color: var(--background-200);
        color: var(--foreground);
        font-family: var(--font-sans);
      }
    }
  </style>

      --ios-gray4: #D1D1D6;
      --ios-gray5: #E5E5EA;
      --ios-gray6: #F2F2F7;

      /* iOS motion */
      --ios-ease: cubic-bezier(0.25, 0.1, 0.25, 1);
      --ios-ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ios-ease-in: cubic-bezier(0.4, 0, 0.6, 1);
    }

    /* ============================================================
       Reset & Base
       ============================================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: var(--font-sans);
      font-weight: 400;
      font-size: 16px;
      line-height: 1.4;
      background: var(--background-200);
      color: var(--foreground);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* iOS-style scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--ios-gray3);
      border-radius: 2px;
    }

    /* Page entrance animation */
    @keyframes ios-fade-in {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .app-shell {
      animation: ios-fade-in 0.4s var(--ios-ease-out);
    }

    /* ============================================================
       Icon System (CSS Mask approach)
       ============================================================ */
    .icon {
      display: inline-block;
      flex-shrink: 0;
      background-color: currentColor;
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
    }

    /* ============================================================
       App Shell — Mobile (390x844) with device frame
       ============================================================ */
    .app-shell {
      position: relative;
      width: 390px;
      height: 844px;
      background: var(--background-200);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border-radius: 47px;
      box-shadow: 0 25px 80px -20px rgba(0, 0, 0, 0.25),
                  0 10px 30px -10px rgba(0, 0, 0, 0.15),
                  0 0 0 1px rgba(0, 0, 0, 0.05);
    }

    /* ============================================================
       Status Bar (44px)
       ============================================================ */
    .status-bar {
      position: relative;
      z-index: 50;
      height: 44px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 calc(var(--spacing) * 6);
      background: var(--background-200);
      color: var(--foreground);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .status-bar__time {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }

    .status-bar__right {
      display: flex;
      align-items: center;
      gap: calc(var(--spacing) * 1.5);
    }

    .signal-bars {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 12px;
    }

    .signal-bars span {
      width: 3px;
      background: var(--foreground);
      border-radius: 1px;
    }

    .signal-bars span:nth-child(1) { height: 4px; }
    .signal-bars span:nth-child(2) { height: 6px; }
    .signal-bars span:nth-child(3) { height: 8px; }
    .signal-bars span:nth-child(4) { height: 11px; }

    .wifi-icon {
      position: relative;
      width: 16px;
      height: 12px;
    }

    .wifi-icon::before,
    .wifi-icon::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      border: 2px solid var(--foreground);
      border-bottom: none;
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    }

    .wifi-icon::before {
      width: 16px;
      height: 10px;
      opacity: 0.3;
    }

    .wifi-icon::after {
      width: 10px;
      height: 6px;
    }

    .wifi-dot {
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--foreground);
    }

    .battery {
      display: flex;
      align-items: center;
      gap: 1px;
    }

    .battery__body {
      position: relative;
      width: 24px;
      height: 11px;
      border: 1px solid var(--foreground);
      border-radius: 3px;
      padding: 1px;
      opacity: 0.9;
    }

    .battery__level {
      height: 100%;
      width: 85%;
      background: var(--foreground);
      border-radius: 1.5px;
    }

    .battery__cap {
      width: 1.5px;
      height: 4px;
      background: var(--foreground);
      border-radius: 0 1px 1px 0;
      opacity: 0.5;
    }

    /* ============================================================
       Navigation Bar — Large Title Style
       ============================================================ */
    .nav-bar {
      position: sticky;
      top: 0;
      z-index: 40;
      flex-shrink: 0;
      background: rgba(242, 242, 247, 0.85);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      padding: calc(var(--spacing) * 2) calc(var(--spacing) * 6) calc(var(--spacing) * 3);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      border-bottom: 0.5px solid transparent;
      transition: border-color 0.3s var(--ios-ease-out), background 0.3s var(--ios-ease-out);
    }

    .nav-bar__title {
      font-size: 34px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--foreground);
    }

    .nav-bar__right {
      display: flex;
      align-items: center;
      gap: calc(var(--spacing) * 2);
      padding-bottom: calc(var(--spacing) * 1);
    }

    .nav-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--ios-gray4);
      color: var(--ios-blue);
      border: none;
      cursor: pointer;
      transition: background-color 0.2s var(--ios-ease-out), transform 0.2s var(--ios-ease-out);
    }

    .nav-btn:hover {
      background: var(--ios-gray3);
    }

    .nav-btn:active {
      transform: scale(0.9);
      background: var(--ios-gray2);
    }

    .nav-btn .icon {
      width: 20px;
      height: 20px;
    }

    /* ============================================================
       Main Content — Scrollable
       ============================================================ */
    .main-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }

    .content-bottom-spacer {
      height: calc(var(--spacing) * 8);
    }

    /* ============================================================
       Profile Header Card
       ============================================================ */
    .profile-header {
      margin: calc(var(--spacing) * 4) calc(var(--spacing) * 6) calc(var(--spacing) * 6);
      background: var(--card);
      border-radius: var(--radius);
      padding: calc(var(--spacing) * 5);
      display: flex;
      align-items: center;
      gap: calc(var(--spacing) * 4);
      box-shadow: var(--shadow-xs);
      border: 0.5px solid var(--ios-separator);
      cursor: pointer;
      transition: all 0.25s var(--ios-ease-out);
      animation: ios-fade-in 0.5s var(--ios-ease-out) backwards;
    }

    .profile-header:hover {
      box-shadow: var(--shadow-sm);
      transform: translateY(-1px);
    }

    .profile-header:active {
      transform: scale(0.99);
      background: var(--ios-gray5);
    }

    .profile-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--ios-blue) 0%, var(--ios-purple) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #ffffff;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .profile-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: calc(var(--spacing) * 1);
    }

    .profile-name {
      font-size: 17px;
      font-weight: 600;
      color: var(--foreground);
      line-height: 1.2;
    }

    .profile-subtitle {
      font-size: 13px;
      color: var(--muted-foreground);
      line-height: 1.2;
    }

    .profile-chevron {
      color: var(--ios-gray);
      flex-shrink: 0;
    }

    .profile-chevron .icon {
      width: 13px;
      height: 13px;
    }

    /* ============================================================
       Settings Group — iOS Grouped Table Style
       ============================================================ */
    .settings-group-header {
      padding: calc(var(--spacing) * 3) calc(var(--spacing) * 7) calc(var(--spacing) * 1.5);
      font-size: 13px;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted-foreground);
      animation: ios-fade-in 0.5s var(--ios-ease-out) backwards;
    }

    .settings-group {
      margin: 0 calc(var(--spacing) * 6) calc(var(--spacing) * 6);
      background: var(--card);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-xs);
      border: 0.5px solid var(--ios-separator);
      animation: ios-fade-in 0.5s var(--ios-ease-out) backwards;
    }

    .settings-cell {
      display: flex;
      align-items: center;
      padding: calc(var(--spacing) * 3.5) calc(var(--spacing) * 4.5);
      cursor: pointer;
      transition: background-color 0.2s var(--ios-ease-out);
      position: relative;
    }

    .settings-cell:hover {
      background: var(--ios-gray5);
    }

    .settings-cell:active {
      background: var(--ios-gray4);
    }

    .settings-cell + .settings-cell::before {
      content: '';
      position: absolute;
      top: 0;
      left: 60px;
      right: 0;
      height: 0.5px;
      background: var(--ios-separator);
    }

    .settings-icon-wrap {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-right: calc(var(--spacing) * 3.5);
    }

    .settings-icon-wrap .icon {
      width: 16px;
      height: 16px;
      color: #ffffff;
    }

    .settings-icon-wrap--blue { background: var(--ios-blue); }
    .settings-icon-wrap--green { background: var(--ios-green); }
    .settings-icon-wrap--orange { background: var(--ios-orange); }
    .settings-icon-wrap--purple { background: var(--ios-purple); }
    .settings-icon-wrap--red { background: var(--ios-red); }
    .settings-icon-wrap--teal { background: var(--ios-teal); }
    .settings-icon-wrap--indigo { background: var(--ios-indigo); }
    .settings-icon-wrap--gray { background: var(--ios-gray); }

    .settings-cell__title {
      flex: 1;
      font-size: 16px;
      font-weight: 400;
      color: var(--foreground);
      line-height: 1.2;
    }

    .settings-cell__detail {
      font-size: 15px;
      color: var(--muted-foreground);
      margin-right: calc(var(--spacing) * 2);
      flex-shrink: 0;
    }

    .settings-cell__chevron {
      color: var(--ios-gray);
      flex-shrink: 0;
    }

    .settings-cell__chevron .icon {
      width: 13px;
      height: 13px;
    }

    /* ============================================================
       iOS Toggle Switch
       ============================================================ */
    .ios-toggle {
      position: relative;
      width: 51px;
      height: 31px;
      flex-shrink: 0;
      margin-right: calc(var(--spacing) * 2);
    }

    .ios-toggle input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .ios-toggle__track {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--ios-gray4);
      border-radius: 31px;
      transition: background-color 0.3s var(--ios-ease-out);
    }

    .ios-toggle__knob {
      position: absolute;
      content: '';
      height: 27px;
      width: 27px;
      left: 2px;
      top: 2px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15), 0 1px 2px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s var(--ios-ease-out);
    }

    .ios-toggle input:checked + .ios-toggle__track {
      background: var(--ios-green);
    }

    .ios-toggle input:checked + .ios-toggle__track + .ios-toggle__knob {
      transform: translateX(20px);
    }

    /* ============================================================
       Bottom Tab Bar — Frosted Glass
       ============================================================ */
    .tab-bar {
      position: relative;
      z-index: 40;
      flex-shrink: 0;
      height: 83px;
      padding-top: 6px;
      background: rgba(249, 249, 249, 0.82);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      border-top: 0.5px solid var(--ios-separator);
      display: flex;
      flex-direction: column;
      box-shadow: 0 -0.5px 0 rgba(0, 0, 0, 0.04);
    }

    .tab-bar__items {
      display: flex;
      align-items: center;
      justify-content: space-around;
      height: 49px;
      padding: 0 calc(var(--spacing) * 1);
    }

    .tab-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      height: 100%;
      color: var(--ios-gray);
      text-decoration: none;
      font-size: 10px;
      font-weight: 500;
      transition: color 0.25s var(--ios-ease-out), transform 0.2s var(--ios-ease-out);
      cursor: pointer;
      position: relative;
    }

    .tab-item .icon {
      width: 26px;
      height: 26px;
      transition: transform 0.25s var(--ios-ease-out);
    }

    .tab-item.is-active {
      color: var(--ios-blue);
    }

    .tab-item.is-active .icon {
      transform: scale(1.05);
    }

    .tab-item:hover {
      color: var(--ios-blue);
    }

    .tab-item:active {
      transform: scale(0.92);
    }

    .tab-item:active .icon {
      transform: scale(0.9);
    }

    .tab-item.is-active::before {
      content: '';
      position: absolute;
      top: 2px;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(0, 122, 255, 0.08);
      z-index: -1;
      transition: all 0.3s var(--ios-ease-out);
    }

    /* Home indicator */
    .home-indicator {
      flex-shrink: 0;
      height: 34px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 8px;
    }

    .home-indicator__bar {
      width: 134px;
      height: 5px;
      border-radius: 3px;
      background: var(--foreground);
      opacity: 0.3;
    }

    /* ============================================================
       Utility
       ============================================================ */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
