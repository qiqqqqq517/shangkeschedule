/* Brand fonts — Anthropic official: Newsreader (editorial display/slogan) +
   Poppins (compact UI) + Lora (reading). Mono kept for code/token surfaces. */
@import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,18..72,300;0,18..72,400;0,18..72,500;1,18..72,400&family=Geist+Mono:wght@400;500&display=swap');
/* ============================================================
   Token model
   1) Primitives — 7 key color cards as 10-step scales (50→900).
      These are the single source of truth (mirrored in the linshi
      preview tool). The flagged "standard" step per group:
        brand-500 · text-800 · bg-100 · icon-700 · border-300 · success-500 · error-500
   2) Semantic tokens — reference the primitives above (no raw hex
      duplicates). These are the API consumed by preview / ui_kits /
      components.
   3) Non-color tokens — font, spacing, radius, shadow, type.
   ============================================================ */
:root {
  
  /* solo-design consumption aliases: explicit prefix for fill-html-head.mjs */
  --claude-background: var(--background, #ffffff);
  --claude-foreground: var(--foreground, #0f172a);
  --claude-card: var(--card, var(--background));
  --claude-card-foreground: var(--card-foreground, var(--foreground));
  --claude-popover: var(--popover, var(--card));
  --claude-popover-foreground: var(--popover-foreground, var(--card-foreground, var(--foreground)));
  --claude-primary: var(--primary, #111827);
  --claude-primary-foreground: var(--primary-foreground, #ffffff);
  --claude-secondary: var(--secondary, var(--muted, var(--card)));
  --claude-secondary-foreground: var(--secondary-foreground, var(--foreground));
  --claude-muted: var(--muted, var(--card));
  --claude-muted-foreground: var(--muted-foreground, var(--foreground));
  --claude-accent: var(--accent, var(--secondary, var(--muted, var(--card))));
  --claude-accent-foreground: var(--accent-foreground, var(--foreground));
  --claude-destructive: var(--destructive, #ef4444);
  --claude-destructive-foreground: var(--destructive-foreground, #ffffff);
  --claude-border: var(--border, currentColor);
  --claude-input: var(--input, var(--border));
  --claude-ring: var(--ring, var(--primary));
  --claude-chart-1: var(--chart-1, var(--primary));
  --claude-chart-2: var(--chart-2, var(--secondary, var(--primary)));
  --claude-chart-3: var(--chart-3, var(--accent, var(--primary)));
  --claude-chart-4: var(--chart-4, var(--muted-foreground, var(--foreground)));
  --claude-chart-5: var(--chart-5, var(--foreground));
  --claude-sidebar: var(--sidebar, var(--background));
  --claude-sidebar-foreground: var(--sidebar-foreground, var(--foreground));
  --claude-sidebar-primary: var(--sidebar-primary, var(--primary));
  --claude-sidebar-primary-foreground: var(--sidebar-primary-foreground, var(--primary-foreground));
  --claude-sidebar-accent: var(--sidebar-accent, var(--accent, var(--muted, var(--card))));
  --claude-sidebar-accent-foreground: var(--sidebar-accent-foreground, var(--accent-foreground, var(--foreground)));

/* ===== 1) Primitive scales · key color cards (10 steps, 50→900) ===== */

  /* ===== 2) Semantic tokens (reference the primitives above) ===== */
  /* bg */
  --background: var(--bg-100);
  --card: var(--bg-200);
  --popover: var(--bg-50);
  --muted: var(--bg-300);
  /* text */
  --foreground: var(--text-800);
  --card-foreground: var(--icon-900);
  --popover-foreground: var(--text-900);
  --primary-foreground: #ffffff;
  --secondary-foreground: var(--text-600);
  --muted-foreground: var(--text-500);
  --accent-foreground: var(--text-900);
  --destructive-foreground: #ffffff;
  /* semantic */
  --primary: var(--brand-500);
  --secondary: #e9e6dc;
  --accent: var(--secondary);
  --input: var(--border-500);
  --ring: var(--brand-500);
  --border: var(--border-300);
  /* status */
  --destructive: var(--error-500);
  --success: var(--success-500);
  --success-foreground: #ffffff;
  --error: var(--error-500);
  --error-foreground: #ffffff;
  /* chart */
  --chart-1: #b05730;
  --chart-2: #9c87f5;
  --chart-3: #ded8c4;
  --chart-4: #dbd3f0;
  --chart-5: #b4552d;
  /* sidebar */
  --sidebar: #f5f4ee;
  --sidebar-foreground: #3d3d3a;
  --sidebar-primary: var(--brand-500);
  --sidebar-primary-foreground: #fbfbfb;
  --sidebar-accent: #e9e6dc;
  --sidebar-accent-foreground: #343434;
  --sidebar-border: var(--border-100);
  --sidebar-ring: #b5b5b5;

  /* ===== 3) Non-color tokens ===== */
  /* font — display (Newsreader) for slogans/headlines, sans (Poppins) for compact UI, serif (Lora) for reading surfaces */
  --font-display: Newsreader, Georgia, ui-serif, serif;
  --font-sans: Poppins, ui-sans-serif, system-ui, sans-serif;
  --font-serif: Lora, Georgia, ui-serif, serif;
  --font-mono: Geist Mono, ui-monospace, monospace;
  /* spacing */
  --spacing: 0.25rem;
  /* radius */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius: 1rem;
  --radius-xl: 20px;
  --radius-2xl: 24px;
  --radius-full: 9999px;
  /* shadow */
  --shadow-x: 0;
  --shadow-y: 1px;
  --shadow-blur: 3px;
  --shadow-spread: 0px;
  --shadow-opacity: 0.1;
  --shadow-color: #000000;
  --shadow-2xs: 0 1px 3px 0px rgba(0, 0, 0, 0.05);
  --shadow-xs: 0 1px 3px 0px rgba(0, 0, 0, 0.05);
  --shadow-sm: 0 1px 3px 0px rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
  --shadow: 0 1px 3px 0px rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
  --shadow-md: 0 1px 3px 0px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 1px 3px 0px rgba(0, 0, 0, 0.1), 0 4px 6px -1px rgba(0, 0, 0, 0.1);
  --shadow-xl: 0 1px 3px 0px rgba(0, 0, 0, 0.1), 0 8px 10px -1px rgba(0, 0, 0, 0.1);
  --shadow-2xl: 0 1px 3px 0px rgba(0, 0, 0, 0.25);
  /* type */
