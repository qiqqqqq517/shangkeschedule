    <style id="theme-vars">

:root {

  /* ===== Semantic tokens ===== */

  /* ===== Page-specific accent colors ===== */

  /* ===== Non-color tokens ===== */
  --font-display: Newsreader, Georgia, ui-serif, serif;
  --font-sans: Poppins, ui-sans-serif, system-ui, sans-serif;

  --spacing: 0.25rem;
  --radius-sm: 8px;
  --radius-md: 12px;

  --radius-xl: 20px;
  --radius-2xl: 28px;

  --shadow-xs: 0 1px 3px 0px rgba(0, 0, 0, 0.05);
  --shadow-sm: 0 1px 3px 0px rgba(0, 0, 0, 0.08), 0 1px 2px -1px rgba(0, 0, 0, 0.06);
  --shadow-md: 0 2px 6px -1px rgba(0, 0, 0, 0.08), 0 1px 3px -1px rgba(0, 0, 0, 0.06);
  --shadow-lg: 0 4px 12px -2px rgba(0, 0, 0, 0.1), 0 2px 6px -2px rgba(0, 0, 0, 0.06);
  --shadow-xl: 0 8px 20px -4px rgba(0, 0, 0, 0.12), 0 4px 8px -4px rgba(0, 0, 0, 0.08);
}
    </style>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      /* ===== Icon system (mask-based) ===== */
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
        flex-shrink: 0;
      }
      [data-icon="house"] { -webkit-mask-image: url('../assets/icons/dl_builtin_claude/house.svg'); mask-image: url('../assets/icons/dl_builtin_claude/house.svg'); }
      [data-icon="user"] { -webkit-mask-image: url('../assets/icons/dl_builtin_claude/user.svg'); mask-image: url('../assets/icons/dl_builtin_claude/user.svg'); }
      [data-icon="map-pin"] { -webkit-mask-image: url('../assets/icons/dl_builtin_claude/map-pin.svg'); mask-image: url('../assets/icons/dl_builtin_claude/map-pin.svg'); }
      [data-icon="circle-plus"] { -webkit-mask-image: url('../assets/icons/dl_builtin_claude/circle-plus.svg'); mask-image: url('../assets/icons/dl_builtin_claude/circle-plus.svg'); }
      [data-icon="tag"] { -webkit-mask-image: url('../assets/icons/dl_builtin_claude/tag.svg'); mask-image: url('../assets/icons/dl_builtin_claude/tag.svg'); }
      [data-icon="chevron-right"] { -webkit-mask-image: url('../assets/icons/dl_builtin_claude/chevron-right.svg'); mask-image: url('../assets/icons/dl_builtin_claude/chevron-right.svg'); }
      [data-icon="star"] { -webkit-mask-image: url('../assets/icons/dl_builtin_claude/star.svg'); mask-image: url('../assets/icons/dl_builtin_claude/star.svg'); }

      /* CSS-drawn clock icon */
      [data-icon="clock"] {
        width: 14px;
        height: 14px;
        border: 1.5px solid currentColor;
        border-radius: 50%;
        background: transparent;
        position: relative;
      }
      [data-icon="clock"]::before {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1.5px;
        height: 4px;
        background: currentColor;
        transform: translate(-50%, -100%);
        transform-origin: bottom center;
        border-radius: 1px;
      }
      [data-icon="clock"]::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        width: 3px;
        height: 1.5px;
        background: currentColor;
        transform: translate(0, -50%);
        transform-origin: left center;
        border-radius: 1px;
      }

      /* CSS-drawn plus icon for FAB */
      [data-icon="plus"] {
        width: 20px;
        height: 20px;
        background: transparent;
        position: relative;
      }
      [data-icon="plus"]::before {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        width: 2px;
        height: 100%;
        background: currentColor;
        transform: translate(-50%, -50%);
        border-radius: 1px;
      }
      [data-icon="plus"]::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        width: 100%;
        height: 2px;
        background: currentColor;
        transform: translate(-50%, -50%);
        border-radius: 1px;
      }
      [data-icon="folder"] { -webkit-mask-image: url('../assets/icons/dl_builtin_claude/folder.svg'); mask-image: url('../assets/icons/dl_builtin_claude/folder.svg'); }
      [data-icon="message-circle-more"] { -webkit-mask-image: url('../assets/icons/dl_builtin_claude/message-circle-more.svg'); mask-image: url('../assets/icons/dl_builtin_claude/message-circle-more.svg'); }

      /* ===== Global ===== */
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg-200);
        color: var(--foreground);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* ===== Phone frame ===== */
      .phone-wrap {
        min-height: 100vh;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 24px 0;
      }
      .phone-screen {
        width: 375px;
        min-height: 812px;
        background: var(--background);
        position: relative;
        overflow: hidden;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
      }

      /* ===== Status bar ===== */
      .status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 24px 6px;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-800);
        font-family: var(--font-sans);
      }
      .status-time {
        flex: 1;
        text-align: left;
        letter-spacing: -0.01em;
      }
      .status-icons {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .status-icon {
        width: 16px;
        height: 16px;
        color: var(--text-700);
      }
      .battery-icon {
        width: 24px;
        height: 12px;
        border: 1.5px solid var(--text-700);
        border-radius: 3px;
        position: relative;
      }
      .battery-icon::after {
        content: '';
        position: absolute;
        right: -3px;
        top: 50%;
        transform: translateY(-50%);
        width: 2px;
        height: 5px;
        background: var(--text-700);
        border-radius: 0 1px 1px 0;
      }
      .battery-fill {
        position: absolute;
        left: 1px;
        top: 1px;
        bottom: 1px;
        width: 75%;
        background: var(--text-700);
        border-radius: 1px;
      }
      .signal-bars {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        height: 12px;
      }
      .signal-bars span {
        width: 3px;
        background: var(--text-700);
        border-radius: 1px;
      }
      .signal-bars span:nth-child(1) { height: 4px; }
      .signal-bars span:nth-child(2) { height: 6px; }
      .signal-bars span:nth-child(3) { height: 8px; }
      .signal-bars span:nth-child(4) { height: 11px; }
      .wifi-icon {
        width: 15px;
        height: 12px;
        position: relative;
      }
      .wifi-icon::before {
        content: '';
        position: absolute;
        left: 50%;
        bottom: 0;
        transform: translateX(-50%);
        width: 4px;
        height: 4px;
        background: var(--text-700);
        border-radius: 50%;
      }
      .wifi-icon::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 0;
        transform: translateX(-50%);
        width: 14px;
        height: 8px;
        border: 2px solid var(--text-700);
        border-bottom: none;
        border-radius: 14px 14px 0 0 / 8px 8px 0 0;
        clip-path: polygon(0 100%, 0 0, 100% 0, 100% 100%, 80% 100%, 60% 40%, 40% 40%, 20% 100%);
      }

      /* ===== Page scroll container ===== */
      .page-content {
        height: calc(812px - 44px);
        overflow-y: auto;
        overflow-x: hidden;
        padding-bottom: 100px;
      }
      .page-content::-webkit-scrollbar { display: none; }
      .page-content { -ms-overflow-style: none; scrollbar-width: none; }

      /* ===== Header section ===== */
      .header-section {
        padding: 12px 24px 20px;
        position: relative;
      }
      .week-tag {
        display: inline-flex;
        align-items: center;
        padding: 4px 12px;
        background: var(--brand-50);
        color: var(--brand-600);
        font: 600 11px/1.2 var(--font-sans);
        letter-spacing: 0.02em;
        border-radius: var(--radius-full);
        margin-bottom: 12px;
      }
      .main-title {
        font: 500 38px/1.1 var(--font-display);
        color: var(--text-900);
        text-align: center;
        letter-spacing: -0.01em;
        margin: 0 0 8px;
      }
      .date-text {
        font: 700 18px/1.3 var(--font-sans);
        color: var(--text-700);
        text-align: center;
        letter-spacing: -0.01em;
        margin: 0;
      }

      /* ===== Next class hero card ===== */
      .next-class-card {
        margin: 4px 20px 20px;
        padding: 18px 18px 16px;
        background: linear-gradient(145deg, var(--lilac-100) 0%, var(--lilac-50) 100%);
        border-radius: var(--radius-2xl);
        border: 1px solid rgba(156, 135, 245, 0.15);
        box-shadow: 0 8px 24px -8px rgba(156, 135, 245, 0.25), 0 2px 6px -2px rgba(156, 135, 245, 0.1);
        position: relative;
        overflow: hidden;
        display: flex;
        justify-content: space-between;
        gap: 16px;
      }
      .next-class-card::before {
        content: '';
        position: absolute;
        top: -30px;
        right: -30px;
        width: 110px;
        height: 110px;
        background: radial-gradient(circle, rgba(255,255,255,0.5) 0%, transparent 70%);
        border-radius: 50%;
      }
      .next-card-left {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .next-card-right {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        justify-content: center;
        gap: 8px;
        flex-shrink: 0;
      }
      .next-label {
        font: 600 10px/1.2 var(--font-sans);
        color: var(--lilac-700);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 6px;
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .next-label-dot {
        width: 5px;
        height: 5px;
        background: var(--lilac-500);
        border-radius: 50%;
        animation: pulse-dot 2s ease-in-out infinite;
      }
      @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(0.8); }
      }
      .next-course-name {
        font: 700 22px/1.2 var(--font-sans);
        color: var(--lilac-800);
        margin: 0 0 8px;
        letter-spacing: -0.01em;
      }
      .next-meta-row {
        display: flex;
        flex-direction: column;
        gap: 5px;
        margin: 0;
      }
      .next-meta-item {
        display: flex;
        align-items: center;
        gap: 4px;
        font: 500 11.5px/1.3 var(--font-sans);
        color: var(--lilac-700);
      }
      .next-meta-icon {
        width: 12px;
        height: 12px;
        color: var(--lilac-500);
      }
      .next-time-badge {
        display: inline-flex;
        align-items: center;
        padding: 6px 12px;
        background: rgba(255, 255, 255, 0.6);
        color: var(--lilac-800);
        font: 700 15px/1.2 var(--font-sans);
        border-radius: var(--radius-full);
        backdrop-filter: blur(4px);
      }
      .countdown-row {
        display: flex;
        align-items: baseline;
        gap: 4px;
      }
      .countdown-number {
        font: 700 26px/1 var(--font-sans);
        color: var(--lilac-800);
        letter-spacing: -0.02em;
      }
      .countdown-label {
        font: 500 11px/1.2 var(--font-sans);
        color: var(--lilac-700);
      }

      /* ===== Timeline section ===== */
      .timeline-section {
        padding: 0 20px;
      }
      .timeline-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
        padding: 0 4px;
      }
      .timeline-title {
        font: 600 13px/1.2 var(--font-sans);
        color: var(--text-600);
        letter-spacing: 0.02em;
      }
      .timeline-count {
        font: 500 12px/1.2 var(--font-sans);
        color: var(--text-400);
      }

      /* Timeline layout */
      .timeline {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .timeline-item {
        display: flex;
        gap: 14px;
      }
      .timeline-time-col {
        width: 56px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        padding-top: 2px;
        position: relative;
      }
      .timeline-time {
        font: 600 13px/1.2 var(--font-sans);
        color: var(--text-700);
        white-space: nowrap;
      }
      .timeline-dot {
        position: absolute;
        right: -9px;
        top: 18px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--background);
        border: 2.5px solid var(--brand-400);
        z-index: 2;
      }
      .timeline-line {
        position: absolute;
        right: -5px;
        top: 30px;
        bottom: -20px;
        width: 2px;
        background: var(--border-200);
      }
      .timeline-item:last-child .timeline-line {
        display: none;
      }

      .timeline-card {
        flex: 1;
        min-width: 0;
        border-radius: var(--radius-xl);
        padding: 16px 16px 14px;
        box-shadow: var(--shadow-sm);
        border: 1px solid transparent;
        position: relative;
      }
      .timeline-card.lilac-card {
        background: linear-gradient(145deg, var(--lilac-50) 0%, #f8f6ff 100%);
        border-color: rgba(156, 135, 245, 0.12);
